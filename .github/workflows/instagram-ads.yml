name: Instagram posts

# Run by hand from the Actions tab. Dry run unless "live" is ticked.
# Free (organic) posts only: nothing here creates paid ads or spends money.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "post (feed), story or reel"
        type: choice
        options: [post, story, reel]
        default: post
      ad:
        description: "Creative id for post/story: countdown, quiz, plan, malayalam"
        type: string
        default: quiz
      live:
        description: "Actually send to Meta (unticked = dry run)"
        type: boolean
        default: false
  # Once posting has been tried by hand, a schedule can rotate posts automatically, e.g.:
  # schedule:
  #   - cron: "30 2 * * *" # 08:00 IST daily

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          COMMAND: ${{ inputs.command }}
          AD: ${{ inputs.ad }}
          LIVE: ${{ inputs.live }}
        run: |
          args=("$COMMAND")
          case "$COMMAND" in post|story) args+=("$AD") ;; esac
          [ "$LIVE" = "true" ] && args+=(--live)
          node marketing/instagram-ads/publish.mjs "${args[@]}"

name: Instagram ads

# Run by hand from the Actions tab. Dry run unless "live" is ticked.
# Paid ads are always created PAUSED; switch them on in Ads Manager.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "post (feed), story, reel, or ads (paused paid ads)"
        type: choice
        options: [post, story, reel, ads]
        default: post
      ad:
        description: "Creative id for post/story: countdown, quiz, plan, malayalam. For ads, a comma list (blank = all)"
        type: string
        default: quiz
      daily:
        description: "ads only: daily budget per ad set in rupees"
        type: string
        default: "400"
      live:
        description: "Actually send to Meta (unticked = dry run)"
        type: boolean
        default: false
  # Once posting has been tried by hand, a schedule can rotate posts automatically, e.g.:
  # schedule:
  #   - cron: "30 2 * * *" # 08:00 IST daily

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          COMMAND: ${{ inputs.command }}
          AD: ${{ inputs.ad }}
          DAILY: ${{ inputs.daily }}
          LIVE: ${{ inputs.live }}
        run: |
          args=("$COMMAND")
          case "$COMMAND" in
            post|story) args+=("$AD") ;;
            ads) [ -n "$AD" ] && args+=(--ids "$AD"); args+=(--daily "$DAILY") ;;
          esac
          [ "$LIVE" = "true" ] && args+=(--live)
          node marketing/instagram-ads/publish.mjs "${args[@]}"

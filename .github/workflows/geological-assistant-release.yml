name: Geological Assistant release

# Builds a signed Geological Assistant AAB from repository secrets. Runs only
# when started by hand (Actions > Geological Assistant release > Run workflow).
# With the "upload" box ticked it sends the AAB to Google Play as a DRAFT
# release on the chosen track. A draft never goes live by itself: someone must
# open it in Play Console and send it for review.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   GA_KEYSTORE_BASE64         base64 of the upload keystore (.jks)
#   GA_KEYSTORE_PASSWORD       keystore password
#   GA_KEY_ALIAS               key alias (upload)
#   GA_KEY_PASSWORD            key password
#   GA_GOOGLE_WEB_CLIENT_ID    Google OAuth web client id used by USS Supabase
#                              Auth > Google (not secret, but kept here so
#                              config/prod.json can stay empty)
#   PLAY_SERVICE_ACCOUNT_JSON  Play Console service account key (upload only)

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the AAB to Google Play as a draft"
        type: boolean
        default: true
      track:
        description: "Play track for the draft"
        type: choice
        options: [production, internal]
        default: production

concurrency:
  group: geological-assistant-release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/geological-assistant-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Check secrets are set
        env:
          KS: ${{ secrets.GA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.GA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.GA_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GA_GOOGLE_WEB_CLIENT_ID }}
        run: |
          missing=0
          for v in KS KS_PASS KEY_ALIAS KEY_PASS GOOGLE_WEB_CLIENT_ID; do
            if [ -z "${!v}" ]; then echo "::error::secret for $v is not set"; missing=1; fi
          done
          exit $missing

      # Release builds must never fall into demo mode, so the web client id
      # from the secret is merged into a copy of config/prod.json.
      - name: Write release config
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GA_GOOGLE_WEB_CLIENT_ID }}
        run: |
          jq --arg id "$GOOGLE_WEB_CLIENT_ID" '.GOOGLE_WEB_CLIENT_ID = $id' config/prod.json > "$RUNNER_TEMP/release.json"
          jq -e 'to_entries | all(.value | length > 0)' "$RUNNER_TEMP/release.json" > /dev/null \
            || { echo "::error::a value in the release config is empty (app would run in demo mode)"; exit 1; }

      - name: Write upload keystore and key.properties
        working-directory: apps/geological-assistant-app/android
        env:
          KS: ${{ secrets.GA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.GA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.GA_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: apps/geological-assistant-app/android
          bundler-cache: true

      # versionName comes from pubspec.yaml; versionCode is the run number so
      # every upload is higher than the last one Play has seen.
      - name: Build AAB (fastlane build)
        working-directory: apps/geological-assistant-app/android
        run: bundle exec fastlane build build_number:${{ github.run_number }} config:"$RUNNER_TEMP/release.json"

      - name: Verify the AAB is signed with the upload key
        run: |
          aab=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose:summary "$aab" > "$RUNNER_TEMP/verify.txt"
          grep -q "jar verified" "$RUNNER_TEMP/verify.txt"
          if keytool -printcert -jarfile "$aab" | grep -q "CN=Android Debug"; then
            echo "::error::AAB is signed with the debug key"; exit 1
          fi
          keytool -printcert -jarfile "$aab" | grep -E "Owner|SHA1|SHA256"

      # Kept on the run page for 7 days, so the AAB can also be uploaded by
      # hand in Play Console (needed for the very first upload of a new app).
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 7
          name: geological-assistant-release-${{ github.run_number }}
          path: apps/geological-assistant-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Google Play (draft)
        if: ${{ inputs.upload }}
        working-directory: apps/geological-assistant-app/android
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not set"; exit 1; fi
          echo "$PLAY_JSON" > "$RUNNER_TEMP/play-key.json"
          export SUPPLY_JSON_KEY="$RUNNER_TEMP/play-key.json"
          bundle exec fastlane ${{ inputs.track }}_draft

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play-key.json"

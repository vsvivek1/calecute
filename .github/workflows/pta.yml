name: PTA app

on:
  pull_request:
    paths:
      - "apps/pta/**"
      - "apps/pta_mobile/**"
      - ".github/workflows/pta.yml"
  push:
    branches: [main]
    paths:
      - "apps/pta/**"
      - "apps/pta_mobile/**"
      - ".github/workflows/pta.yml"

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      # Migrations, seed, row-level security suite and every API function.
      - run: sh apps/pta/supabase/tests/run.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=apps/pta
      - run: npm run build --workspace=apps/pta
        env:
          PTA_DEMO: "1"

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pta_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: calecutech-pta-debug-apk
          path: apps/pta_mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

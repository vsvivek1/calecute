<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsubscribe | Calecute</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f2a33">
<style>
  :root { --bg: #f4f1ec; --card: #fff; --ink: #1f2a33; --muted: #5b6670; --accent: #b4531f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14191e; --card: #1f2a33; --ink: #eef1f3; --muted: #a9b3bb; --accent: #e07b45; } }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 48px 16px; }
  .card { background: var(--card); border-radius: 12px; padding: 24px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  p { margin: 0 0 14px; }
  .muted { color: var(--muted); font-size: .9rem; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
</style>
</head>
<body>
<main>
  <div class="card" id="box" aria-live="polite">
    <h1>Unsubscribe</h1>
    <p>Checking your link&hellip;</p>
  </div>
  <p class="muted" style="margin-top:16px">Calecute Technologies (OPC) Private Limited, Kozhikode, Kerala &middot; <a href="mailto:info@calecutech.com">info@calecutech.com</a></p>
</main>
<script>
(function () {
  var API = 'https://vspbbwpehvenmxddgbhm.supabase.co/functions/v1/offer-unsubscribe';
  var box = document.getElementById('box');
  var t = new URLSearchParams(location.search).get('t') || '';
  function show(title, text, button) {
    box.replaceChildren();
    var h = document.createElement('h1'); h.textContent = title; box.append(h);
    var p = document.createElement('p'); p.textContent = text; box.append(p);
    if (button) box.append(button);
  }
  function call(method) {
    return fetch(API + '?t=' + encodeURIComponent(t), { method: method }).then(function (r) {
      return r.json().then(function (b) { if (!r.ok) throw new Error(b.error || 'Something went wrong'); return b; });
    });
  }
  if (!t) return show('Unsubscribe', 'This link is missing its code. Use the Unsubscribe link from the email, or write to info@calecutech.com.');
  call('GET').then(function (b) {
    if (b.unsubscribed) return show('You are unsubscribed', b.email + ' will not get offer emails from us again.');
    var btn = document.createElement('button');
    btn.textContent = 'Unsubscribe ' + b.email;
    btn.onclick = function () {
      btn.disabled = true;
      call('POST').then(function (r) {
        show('You are unsubscribed', r.email + ' will not get offer emails from us again.');
      }, function (e) { btn.disabled = false; show('Could not unsubscribe', e.message + '. Please try again, or write to info@calecutech.com.', btn); });
    };
    show('Stop offer emails?', 'We will not send offer emails to ' + b.email + ' again, for any course.', btn);
  }, function (e) { show('Unsubscribe', e.message + '. Write to info@calecutech.com and we will remove you.'); });
})();
</script>
</body>
</html>
